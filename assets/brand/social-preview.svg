<text x="503" y="146" font-family="Fredoka" font-weight="600" font-size="112" fill="#ece5d8">Vocaline</text>
<text x="640" y="236" text-anchor="middle" font-family="Open Sauce Sans" font-size="25" fill="#a39b8c">Local dictation for Linux. The sentence forms as you speak, and is pasted when you stop.</text>
