<text x="128" y="500"><tspan fill="#edd643">listening</tspan></text><text x="246" y="500" fill="#ece5d8">model loaded</text><text x="760" y="500" text-anchor="end" fill="#edd643">0.4 s</text>
<text x="128" y="530"><tspan fill="#edd643">partial</tspan></text><text x="246" y="530" fill="#7d7567">&quot;I&#x27;ll send you the report tomor&quot;</text><text x="760" y="530" text-anchor="end" fill="#7d7567">forming</text>
<text x="128" y="560"><tspan fill="#edd643">final</tspan></text><text x="246" y="560" fill="#ece5d8">&quot;I&#x27;ll send you the report tomorrow.&quot;</text><text x="760" y="560" text-anchor="end" fill="#edd643">frozen</text>
<text x="128" y="590"><tspan fill="#edd643">paste</tspan></text><text x="246" y="590" fill="#ece5d8">→ the window you started in</text><text x="760" y="590" text-anchor="end" fill="#edd643">once</text>
