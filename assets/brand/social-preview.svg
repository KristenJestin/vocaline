<text x="128" y="630" font-family="Open Sauce Sans" font-size="19" fill="#a39b8c">Released, the dictation is pasted where you were typing.</text>
<rect x="808" y="362" width="344" height="300" rx="14" fill="#14120f" stroke="#2e2a24" stroke-width="2"/>
<text x="836" y="398" font-family="Open Sauce Sans" font-weight="600" font-size="14" letter-spacing="1.5" fill="#edd643">WHILE YOU SPEAK</text>
<text x="836" y="438" font-family="Fredoka" font-weight="600" font-size="27" fill="#ece5d8">I&#x27;ll send you the</text>
<text x="836" y="472" font-family="Fredoka" font-weight="600" font-size="27" fill="#ece5d8">report tomorrow.</text>
<text x="836" y="506" font-family="Fredoka" font-weight="500" font-size="27" fill="#7d7567">And the slides</text>
<text x="836" y="540" font-family="Fredoka" font-weight="500" font-size="27" fill="#7d7567">with it<tspan fill="#edd643" font-weight="600"> |</tspan></text>
