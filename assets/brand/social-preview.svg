<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="640" viewBox="0 0 1280 640">
<!-- The mark, the name, the tagline, and below them screen.svg on a plain screen: a message being
     written, and the pill with the phrase forming. -->
<defs>
<pattern id="dots" width="19" height="19" patternUnits="userSpaceOnUse"><circle cx="9.5" cy="9.5" r="1.05" fill="#2a2520"/></pattern>
<radialGradient id="glow" cx="640" cy="640" r="620" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#edd643" stop-opacity="0.10"/><stop offset="1" stop-color="#edd643" stop-opacity="0"/></radialGradient>
<clipPath id="frame"><rect x="96" y="290" width="1088" height="400" rx="18"/></clipPath>
</defs>
<rect width="1280" height="640" fill="#14120f"/>
<g transform="translate(336.0 22) scale(0.78)"><g transform="translate(15.7 12.3) scale(0.8511)"><path d="M14 100 L16 102.4 L18 107.3 L20 113 L22 118.2 L24 121.3 L26 121.4 L28 117.9 L30 111 L32 101.3 L34 90 L36 78.7 L38 68.9 L40 62.4 L42 60.1 L44 62.8 L46 70.4 L48 82 L50 96.3 L52 111.6 L54 125.9 L56 137.2 L58 144.2 L60 145.9 L62 142 L64 133.1 L66 120.4 L68 105.5 L70 90.4 L72 76.9 L74 66.8 L76 61.2 L78 60.5 L80 64.5 L82 72.5 L84 83.1 L86 94.6 L88 105.5 L90 114.2 L92 119.7 L94 121.7 L96 120.3 L98 116.3 L100 110.7 L102 105.1 L104 101 L106 100 L166 100" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" fill="none" stroke="#edd643"/><path d="M184 66 V 134" stroke-width="14" stroke-linecap="round" fill="none" stroke="#ece5d8"/></g></g>
<text x="509" y="146" font-family="Fredoka" font-weight="600" font-size="112" fill="#ece5d8">Vocaline</text>
<text x="640" y="236" text-anchor="middle" font-family="Open Sauce Sans" font-size="25" fill="#a39b8c">Local dictation for Linux. The sentence forms as you speak, and is pasted when you stop.</text>
<!-- screen.svg scaled to 0.64, framed from under the window's title bar to just below the pill. -->
<g clip-path="url(#frame)">
<rect x="96" y="290" width="1088" height="400" fill="#1a1714"/>
<rect x="96" y="290" width="1088" height="400" fill="url(#dots)"/>
<rect x="96" y="290" width="1088" height="400" fill="url(#glow)"/>
<image href="screen.svg" xlink:href="screen.svg" x="42" y="131" width="1024" height="640"/>
</g>
<rect x="96" y="290" width="1088" height="400" rx="18" fill="none" stroke="#2e2a24" stroke-width="2"/>
</svg>
