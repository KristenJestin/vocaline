[package]
name = "vocaline"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
description = "Live local dictation: the phrase shows while you speak, and is pasted at the pause"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11"
toml = "1.1.8"
wl-clipboard-rs = "0.9"
