[package]
name = "vocaline"
version = "0.1.2"
edition = "2024"
license = "Apache-2.0"
description = "Live local dictation: the phrase shows while you speak, and is pasted at the pause"

[dependencies]
jiff = { version = "0.2.38", default-features = false, features = ["std", "tz-system", "serde"] }
rustix = { version = "1", features = ["event", "fs"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11"
toml = "1.1.8"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wl-clipboard-rs = "0.9"
